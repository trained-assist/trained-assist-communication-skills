name: CI and deploy
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run gate
      - name: Check Worker bundle
        run: npx wrangler deploy --dry-run --outdir=dist

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Deploy reviewed main revision
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: npx wrangler deploy --var BUILD_SHA:${{ github.sha }}
      - name: Verify public revision
        env:
          EXPECTED_BUILD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5 6; do
            if HEALTH=$(curl -fsS --max-time 10 https://trained-assist-communication-skills.skillset-apply.workers.dev/health); then
              # A newly deployed Worker may briefly serve an older health payload
              # while edge propagation completes. Treat malformed/missing build
              # metadata as a retryable mismatch, not a shell failure.
              ACTUAL_BUILD_SHA=$(printf '%s' "$HEALTH" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{const h=JSON.parse(s);if(typeof h.build==="string"&&h.build)process.stdout.write(h.build)}catch{}})' || true)
              if [ "$ACTUAL_BUILD_SHA" = "$EXPECTED_BUILD_SHA" ]; then
                echo "Public Communication Worker revision verified: $ACTUAL_BUILD_SHA"
                exit 0
              fi
              echo "Waiting for public revision: got ${ACTUAL_BUILD_SHA:-missing build metadata}, expected $EXPECTED_BUILD_SHA"
            fi
            sleep 10
          done
          echo "Public Communication Worker did not serve expected revision $EXPECTED_BUILD_SHA" >&2
          exit 1
